name: Landing CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:
    inputs:
      rollback_sha:
        description: "Commit SHA to redeploy for rollback"
        required: false
        type: string

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run test
      - run: npm run build
      - run: npm audit --omit=dev --audit-level=high
      - name: Smoke test
        run: |
          npm run preview -- --host 127.0.0.1 --port 4173 &
          echo $! > /tmp/vite.pid
          for i in {1..30}; do
            curl -fsS http://127.0.0.1:4173/ >/dev/null && break
            sleep 1
          done
          curl -fsS http://127.0.0.1:4173/ >/dev/null
          kill "$(cat /tmp/vite.pid)"

  rollback:
    if: github.event_name == 'workflow_dispatch' && inputs.rollback_sha != ''
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: |
          git checkout "${{ inputs.rollback_sha }}"
          echo "Rollback candidate checked out: ${{ inputs.rollback_sha }}"
          echo "Connect this step to the landing deploy provider CLI using protected environment secrets."
